<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Robux 🤑🤑🤑</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
            max-width: 800px;
            width: 90%;
        }

        h1 {
            color: #ff4081;
        }

        button {
            padding: 15px 35px;
            font-size: 20px;
            border: none;
            border-radius: 10px;
            background: #ff4081;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.1);
        }

        #videoBox {
            display: none;
            margin-top: 20px;
        }

        video {
            width: 100%;
            max-width: 700px;
            border-radius: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎁 Chúc mừng!</h1>
    <p>Bạn vừa nhận được 1000 robux từ anh Bùm rô bờ lốc 🤑🤑.</p>

    <button id="giftBtn" onclick="showVideo()">
        Nhấn để nhận Robux miễn phí
    </button>

    <div id="videoBox">
        <h2>Nhấn để nhận robux miễn phí 🤑🤑🤑🤑</h2>

        <video id="memeVideo" controls autoplay>
            <source src="Huấn Hoa Hồng - Có làm thì mới có ăn-Lyrics Video - YouTube.mp4" type="video/mp4">
            Trình duyệt của bạn không hỗ trợ video.
        </video>
    </div>
</div>

<script>
function showVideo() {
    document.getElementById("giftBtn").style.display = "none";
    document.getElementById("videoBox").style.display = "block";

    const video = document.getElementById("memeVideo");
    video.play();
}
</script>

</body>
</html>
